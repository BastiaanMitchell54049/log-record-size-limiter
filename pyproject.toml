[project]
name = "log-record-size-limiter"
version = "0.1.0"
description = "A logging handler wrapper that truncates oversized serialized records before passing them downstream"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
